name: Build OpenWrt for Mercury D121G

# 手动触发（Actions 页面点 "Run workflow"）
on:
  workflow_dispatch:
  # 改了 config / 补丁 / 设备树就自动编一次
  push:
    branches: [ main ]
    paths:
      - 'configs/**'
      - 'patches/**'
      - 'dts/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    name: ramips/mt7620 · mercury_d121g
    runs-on: ubuntu-22.04
    # GitHub 单个 job 上限 6 小时，从零编译约 2~4 小时
    timeout-minutes: 350

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      # OpenWrt 从零编译需要 ~25GB，runner 默认不够，先清掉预装的大件
      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/local/lib/node_modules /opt/az /usr/lib/jvm
          sudo apt-get clean
          df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget

      - name: 拉取 OpenWrt 源码
        run: |
          git clone --depth 1 -b v24.10.2 \
            https://github.com/openwrt/openwrt.git openwrt
          cd openwrt && git log -1 --format='OpenWrt %h %ad'

      - name: 安装 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 打补丁 + 放设备树
        run: |
          cd openwrt
          for p in ../patches/*.patch; do
            echo "==> $(basename "$p")"
            patch -p1 < "$p"
          done
          cp ../dts/mt7620a_mercury_d121g.dts target/linux/ramips/dts/

      - name: 应用 config
        run: |
          cd openwrt
          cp ../configs/d121g_defconfig .config
          make defconfig
          echo "--- 最终选中的机型 ---"
          grep -E '^CONFIG_TARGET_(PROFILE|ramips_mt7620_DEVICE)' .config

      - name: 下载源码包
        run: cd openwrt && make -j$(nproc) download

      - name: 编译
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-mercury_d121g
          path: |
            openwrt/bin/targets/ramips/mt7620/*.bin
            openwrt/bin/targets/ramips/mt7620/*.manifest
            openwrt/bin/targets/ramips/mt7620/sha256sums
          if-no-files-found: error
          retention-days: 30
